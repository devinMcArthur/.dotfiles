# Per-user makepkg overrides, read after /etc/makepkg.conf.
#
# !debug: Arch's default OPTIONS include `debug`, so every AUR build through
# yay also produced and installed a <pkg>-debug package (22 of them by
# 2026-10-22: yay-debug, voxtype-bin-debug, ...). Nothing here uses them.
# Everything else matches the stock line.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

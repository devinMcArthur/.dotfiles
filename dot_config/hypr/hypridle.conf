general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# Power-aware idle timeouts. hypridle has no native AC/battery profiles, so each
# listener guards its action by AC state (ACAD/online: 1 = plugged, 0 = battery).
# All listeners still fire at their timeout; the guard just no-ops the command
# when the power state doesn't match. on-resume actions are left unguarded since
# restoring brightness / dpms-on is idempotent and should always recover.
#
# Battery (online=0): dim 2.5min, lock 5min, screen-off 5.5min
# Plugged in (online=1): dim 10min, lock 20min, screen-off 20.5min

# --- backlight dim ---------------------------------------------------------
listener {                                       # battery: dim @ 2.5min
    timeout = 150
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = 0 ] && brightnessctl -s set 10
    on-resume  = brightnessctl -r
}
listener {                                       # plugged in: dim @ 10min
    timeout = 600
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = 1 ] && brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# --- lock session ----------------------------------------------------------
listener {                                       # battery: lock @ 5min
    timeout = 300
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = 0 ] && loginctl lock-session
}
listener {                                       # plugged in: lock @ 20min
    timeout = 1200
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = 1 ] && loginctl lock-session
}

# --- screen off (dpms) -----------------------------------------------------
listener {                                       # battery: screen off @ 5.5min
    timeout = 330
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = 0 ] && hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
listener {                                       # plugged in: screen off @ 20.5min
    timeout = 1230
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = 1 ] && hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}


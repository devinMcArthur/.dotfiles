# Soteria is plain GTK4 (not libadwaita), so it ignores the prefer-dark
# gsettings hint — hand it the Catppuccin GTK theme explicitly (same static-
# Mocha convention as the greeter; per-theme accents aren't worth a service
# restart wired into every theme switch).
[Service]
Environment=GTK_THEME=catppuccin-mocha-blue-standard+default

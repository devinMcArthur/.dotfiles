# voice-control places — spoken name = URL
#
# Firefox bookmarks are read automatically, so anything bookmarked is
# already speakable ("open cloudflare", "go to the remarkable app").
# This file is for the rest: private apps and internal dashboards that
# no bookmark holds and no model could guess.
#
# Matching is fuzzy and ignores the words the/app/site/page/dashboard,
# so "bow mark app" finds "bow mark".
#
# bow mark = https://app.bowmark.example
# scheduler = https://scheduler.internal.example

# Single source of truth for the desktop palette — Catppuccin Mocha.
# Consumed by *.tmpl configs as {{ .theme.colors.<token> }} (hex, no '#',
# so templates can emit "#rrggbb", "rgba(rrggbbaa)", or bare hex as needed).
#
# Phase 2 (theme switching) will swap these values per-theme; until then
# this is the one place the palette lives. Files still hardcoding Mocha
# for structural reasons (regen-keybinds hashes them by exact source path):
# dot_config/hypr/hyprland.conf (border gradient), dot_tmux.conf (statusline).
theme:
  name: "catppuccin-mocha"
  # Names understood by specific tools:
  ghostty: "Catppuccin Mocha"     # built-in ghostty theme (display-name style, with space)
  nvim: "catppuccin"              # colorscheme command / plugin
  nvimFlavour: "mocha"
  colors:
    rosewater: "f5e0dc"
    flamingo: "f2cdcd"
    pink: "f5c2e7"
    mauve: "cba6f7"
    red: "f38ba8"
    maroon: "eba0ac"
    peach: "fab387"
    yellow: "f9e2af"
    green: "a6e3a1"
    teal: "94e2d5"
    sky: "89dceb"
    sapphire: "74c7ec"
    blue: "89b4fa"
    lavender: "b4befe"
    text: "cdd6f4"
    subtext1: "bac2de"
    subtext0: "a6adc8"
    overlay2: "9399b2"
    overlay1: "7f849c"
    overlay0: "6c7086"
    surface2: "585b70"
    surface1: "45475a"
    surface0: "313244"
    base: "1e1e2e"
    mantle: "181825"
    crust: "11111b"
    # Semantic aliases (duplicated hex — YAML has no refs):
    accent: "f9e2af"              # yellow — primary accent (border gradient start)
    accent2: "fab387"             # peach — secondary accent (gradient end)
